[project]
name = "pods-local-transcription"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    # spaCy G2P model for misaki[en]. Must ship in the venv: the runtime
    # auto-download path shells out to `uv pip install` and fails. Models are
    # not on PyPI; this is explosion's official release wheel, hash-pinned in
    # uv.lock. Compatible with spacy>=3.8,<3.9.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.5",
    "mlx-whisper==0.4.3",
    "trafilatura>=2.2.0",
]

[tool.uv]
package = false
