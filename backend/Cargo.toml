[package]
name = "pods-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pods_backend"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "pods-backend"
path = "src/bin/pods-backend.rs"
required-features = ["passkey"]

[[bin]]
name = "pods-transcribe"
path = "src/bin/pods-transcribe.rs"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
# Direct libc is required for flock(2). This pin is the version already in Cargo.lock.
libc = "=0.2.189"
rusqlite = { version = "0.32.1", features = ["bundled", "functions"] }
roxmltree = "=0.21.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.8"
thiserror = "2.0.12"
ureq = "2.12.1"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
webauthn-rs = { version = "0.5.2", optional = true, features = ["danger-allow-state-serialisation"] }

[features]
default = []
passkey = ["webauthn-rs"]

[dev-dependencies]
tempfile = "3.20.0"
