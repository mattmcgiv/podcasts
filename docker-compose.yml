# Canonical runtime for the Hetzner dev box (and any Docker host).
# Secrets/host config come from ./.env next to this file — never committed.
# Optional: PODCASTINDEX_KEY/SECRET, PODS_HOSTNAME.

services:
  pods:
    build: .
    restart: unless-stopped
    environment:
      PODCASTINDEX_KEY: ${PODCASTINDEX_KEY:-}
      PODCASTINDEX_SECRET: ${PODCASTINDEX_SECRET:-}
      RUST_LOG: ${RUST_LOG:-pods_server=info}
    volumes:
      - pods-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PODS_HOSTNAME: ${PODS_HOSTNAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-matt@bosquesoftware.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pods-data:
  caddy-data:
  caddy-config:
