[package]
name = "pods-server"
version = "0.1.0"
edition = "2021"

[features]
# Embeds client/dist into the release binary. Off for dev/test so the
# server builds without a frontend build present.
ui = ["dep:rust-embed", "dep:mime_guess"]
# Exposes a C ABI start/stop wrapper for embedding the server in an iOS app.
ios-ffi = []

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ammonia = "4"
quick-xml = "0.37"
sha1 = "0.10"
hex = "0.4"
dotenvy = "0.15"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
tempfile = "3"
